    .tetitem[itemtitle=zeiger] svg {
        transform: rotate(47deg);
        transform-origin: 183px 230px;
        transform-origin: 185px 223px;
        transform-origin: 185px 223px;
        transform-origin: 188px 219px;
        xoutline: 1px solid green;
        transition-timing-function: cubic-bezier(0, 1.06, 1.0, 0.96);
        transition-timing-function: cubic-bezier(0.1, .3, .3, 1);
    }
</style><script type="sebscript">(function() {
    console.log("610B-Code")
    var $tetitem= $('#pl_1119236');
    var electrometer = $tetitem.parent().closest(".tetitem");
    var zeiger = $tet("zeiger", electrometer);
    var zeigerSVG = zeiger.find("svg");

    var on = false;
    var zero = true;
    var scale = 1;
    var center = 0;
    var negative = false;
    var inputU=0;
    var inputT=0;
    //var curU=0;
    
    var phiLeft = -57;
    var phiRight = 56;
    var phiZero = -47.6;
    var warp = 1;
    
    window.e610 = electrometer[0];
    
    window.e610.isReady = 
    function isReady() {
        return on && !zero;        
    }
    function curU() {
        var pp = get_css_transform(zeigerSVG[0], 3);
        var curPhi = pp.angle;
        var u = (curPhi - phiZero) / (-phiZero/5);
        if(center) u -= 5;
        if(negative) u *=-1;
        if(scale==3) u /= 10/3;
        else    u/=10;
        return u;
    }
    window.e610.curU = curU;

    function rotToPhi(x, t) {
        if(t===undefined) t = 1;
        
        var pp = get_css_transform(zeigerSVG[0], 3);
        var curPhi = pp.angle;
        console.log("curPhi", curPhi, "-->", x, "t:", t)
        zeigerSVG.css({
            transform: "rotate("+curPhi+"deg)",
            "transition": ""
        })
        //TODO -- adjust time based on curPhi vs x
        setTimeout(function() {
            zeigerSVG.css({
                transform: "rotate("+x+"deg)",
                "transition-duration": t+"s"
            });
        }, 1); // otherwise "transition" not reset (on chrome at least...)
    }
    window.e610.rotToPhi = rotToPhi;
    function rotToU(x, t) {
        console.log("rotToU", x, t, "warp:",warp, "on:", on);
        if(!on) return;
        //curU = x;   // FIXME should be set incrementally while moving up....
        if(scale==3) x *= 10/3;
        else    x*=10;
        x *= -phiZero/5;
        if(!center) {
            if(!negative) x+=  phiZero;
            else          x =  phiZero -x;
        }
        if(x<phiLeft ) { x = phiLeft;  t = .8 }
        if(x>phiRight ) { x = phiRight;  t = .8 }
        rotToPhi(x, t);
    }
    window.e610.rotToU = rotToU;

    function setInputUT(target, time) {
        if(time === undefined) time = 1; 
        time /= warp;
        inputU=target;
        inputT=time;
        if(zero) return;
        if(curU() > target) {
            rotToU(curU(), 0);
            return;
        }
        rotToU(target, time);
    }

    var $this = $(_this);

        _this.drehbar_on = false;
        if($this.hasClass("ui-draggable")) {

    _this.drehbar_on = true;
    _this.drehbar_x0 = _this.drehbar_x;
    _this.drehbar_y0 = _this.drehbar_y;
    _this.drehbar_a0 = get_css_transform(_this);
    _this.drehbar_a0 = (_this.drehbar_a0 && _this.drehbar_a0.angle) || 0;

    var a = Math.atan2(_this.drehbar_y-_this.drehbar_yc, _this.drehbar_x-_this.drehbar_xc);
    a = a * (180 / Math.PI);
    _this.drehbar_a0 -= a;

    if(window.TETTOOL_DEBUG) console.log("start", _this.id, _this.drehbar_a0,  a)
    if($this.hasClass("ui-draggable")) $this.draggable( "disable" );
