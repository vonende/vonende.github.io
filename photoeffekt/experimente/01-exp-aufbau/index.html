</style><script type="sebscript">(function() {
    console.log("610B-Code")
    var $tetitem= $('#pl_1119236');
    var electrometer = $tetitem.parent().closest(".tetitem");
    var zeiger = $tet("zeiger", electrometer);
    var zeigerSVG = zeiger.find("svg");

    var on = false;
    var zero = true;
    var scale = 1;
    var center = 0;
    var negative = false;
    var inputU=0;
    var inputT=0;
    //var curU=0;
    
    var phiLeft = -57;
    var phiRight = 56;
    var phiZero = -47.6;
    var warp = 1;
    
    window.e610 = electrometer[0];
    
    window.e610.isReady = 
    function isReady() {
        return on && !zero;        
    }
    function curU() {
        var pp = get_css_transform(zeigerSVG[0], 3);
        var curPhi = pp.angle;
        var u = (curPhi - phiZero) / (-phiZero/5);
        if(center) u -= 5;
        if(negative) u *=-1;
        if(scale==3) u /= 10/3;
        else    u/=10;
        return u;
    }
    window.e610.curU = curU;

    function rotToPhi(x, t) {
        if(t===undefined) t = 1;
        
        var pp = get_css_transform(zeigerSVG[0], 3);
        var curPhi = pp.angle;
        console.log("curPhi", curPhi, "-->", x, "t:", t)
        zeigerSVG.css({
            transform: "rotate("+curPhi+"deg)",
            "transition": ""
        })
        //TODO -- adjust time based on curPhi vs x
        setTimeout(function() {
            zeigerSVG.css({
                transform: "rotate("+x+"deg)",
                "transition-duration": t+"s"
            });
        }, 1); // otherwise "transition" not reset (on chrome at least...)
    }
    window.e610.rotToPhi = rotToPhi;
    function rotToU(x, t) {
        console.log("rotToU", x, t, "warp:",warp, "on:", on);
        if(!on) return;
        //curU = x;   // FIXME should be set incrementally while moving up....
        if(scale==3) x *= 10/3;
        else    x*=10;
        x *= -phiZero/5;
        if(!center) {
            if(!negative) x+=  phiZero;
            else          x =  phiZero -x;
        }
        if(x<phiLeft ) { x = phiLeft;  t = .8 }
        if(x>phiRight ) { x = phiRight;  t = .8 }
        rotToPhi(x, t);
    }
    window.e610.rotToU = rotToU;

    function setInputUT(target, time) {
        if(time === undefined) time = 1; 
        time /= warp;
        inputU=target;
        inputT=time;
        if(zero) return;
        if(curU() > target) {
            rotToU(curU(), 0);
            return;
        }
        rotToU(target, time);
    }
    e610.setInputUT = setInputUT


    $("[name=warp]", electrometer).on("change", function (ev, arg) {
        var w = 1+4*this.checked;
        if(warp != w) inputT = inputT * warp / w;
        warp = w;
        if(zero) return;
        rotToU(inputU, inputT);
    });
        
    $tet("meter", electrometer).on("diashow_change", function (ev, arg) {
        if(arg.i>0) tetshow("on");
        else        tethide("on");
        center = arg.i === 4;
        negative = arg.i === 3;
        if(arg.i===0) {
            on=false;
            rotToPhi(phiLeft, 1);
        } else if(arg.i==1) {
            on=false;
            rotToPhi(phiZero, 1);
        } else {
            on=true;
            if(!zero) {
                if(Math.abs(inputU - curU())>.05)         rotToU(inputU, inputT);
                else                       rotToU(inputU, .5); // switching to negative?
            }
            else      rotToU(0, .3);
        }
    });
    $tet("mb", electrometer).on("diashow_change", function (ev, arg) {
        var cu=curU();
        scale = arg.i ? 3 : 1;
        if(!zero && on) {
            rotToU(cu, .5);
            setTimeout(function() { 
                if(Math.abs(inputU - cu)>.05)         rotToU(inputU, inputT);
                else                                      rotToU(inputU, .5);
            }, 500);
        }
    });

    $tet("hz_zero", electrometer).on("click", function () {
        tettoggle("UNLOCK");
        zero ^= 1; // toggle bool;
        if(!on) return;
        if(zero) {
            rotToU(0, 1);
        } else {
            rotToU(inputU, inputT);
        }
    });
    $tetitem.on("tet:beforedynvar", function() {
        tethide("UNLOCK");
        tethide("on");
        rotToPhi(phiLeft);
    })
 })();
